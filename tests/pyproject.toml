[project]
name = "line-skills-tests"
version = "0.1.0"
description = "Trigger-accuracy evaluation and description optimization for line-skills"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.0.10",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
]

[project.scripts]
line-skills = "eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
# -v: per-test names. -s: don't capture stdout/stderr so progress streams live.
addopts = "-v -s --tb=short"

[dependency-groups]
dev = []
